name: Build Server Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем код репозитория на виртуальную машину GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Поднимаем и настраиваем окружение Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Запускаем тестовую сборку Docker-образа
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Server
        file: ./Server/Dockerfile
        push: false # Нам пока важно просто проверить, компилируется ли C++ код в Docker
        tags: secure-notes-server:latest
